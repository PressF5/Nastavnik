spring:
  application:
    name: nastavnik-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: 900000000
      refresh-token-expiration: 2592000000
logging:
  level:
    org:
      springframework:
        security: TRACE